<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Geisternetz Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
       /* Lokale Ergänzungen für das Karten-Design (Grid-Layout für die Netz-Anzeige) */
        .net-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .net-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 5px solid var(--wave-cyan);/* Akzentfarbe für die Karten */
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            background: #eee;
            margin-top: 10px;
        }
        .btn-small {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 12px;
            background: var(--wave-cyan, #0077be);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }
        .btn-small:hover { opacity: 0.9; }
        .nav-btn {
            background: var(--coral, #ff7f50);/* Korallenrot für Action-Buttons */
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #002b36; color: white;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <img src="Copilot_20260126_202152.png" alt="Logo" style="height: 60px; width: auto; border-radius: 5px;">
        <h1 style="margin: 0; font-size: 1.5em;">Geisternetze NGO Dashboard</h1>
    </div>
    <nav>
        <a href="report.html" class="nav-btn">Neues Netz melden</a>
    </nav>
</header>

<div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    
    <div class="filter-bar" style="background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <label for="filterStatus" style="font-weight: bold;">Status filtern:</label>
        <select id="filterStatus" onchange="applyFilters()" style="padding: 5px; margin-left: 10px;">
            <option value="">Alle Netze</option>
            <option value="REPORTED">Gemeldet</option>
            <option value="RECOVERY_SCHEDULED">In Bergung</option>
            <option value="RECOVERED">Geborgen</option>
            <option value="LOST">Verschollen</option>
        </select>
    </div>

    <div class="list-header">
        <h2>Aktuelle Funde</h2>
    </div>
    
    <div id="netList" class="net-grid">
        <p>Verbindung zum Backend wird aufgebaut...</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
