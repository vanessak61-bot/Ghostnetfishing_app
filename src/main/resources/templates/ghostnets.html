<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gemeldete Geisternetze</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Gemeldete Geisternetze</h1>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Koordinaten</th>
                <th>Größe</th>
                <th>Status</th>
                <th>Gemeldet am</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="net : ${ghostnets}">
                <td th:text="${net.id}"></td>
                <td th:text="${net.latitude + ', ' + net.longitude}"></td>
                <td th:text="${net.sizeEstimate}"></td>
                <td th:text="${net.status}"></td>
                <td th:text="${net.reportedAt}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
